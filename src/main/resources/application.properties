spring.application.name=reservas-restaurante

# =============================================================
# Base de datos — sobrescribe con variables de entorno
# =============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurante}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# =============================================================
# JPA / Hibernate
# =============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true

# =============================================================
# Logging
# =============================================================
logging.level.com.dscb.reservas_restaurante=INFO